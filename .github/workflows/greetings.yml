name: Community Greetings

on: [issues, pull_request_target]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: "👋 Welcome to **AegisScan**! Thank you for opening your first issue. Our team and community maintainers will triage it shortly. Feel free to check out our [Contributing Guide](CONTRIBUTING.md) or [Roadmap](ROADMAP.md)!"
        pr-message: "🎉 Thank you for submitting your first Pull Request to **AegisScan**! We truly appreciate your contribution to open-source cybersecurity. Our CI pipeline is reviewing your changes, and a maintainer will review it soon."
