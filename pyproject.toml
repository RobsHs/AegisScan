[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisscan"
version = "1.0.0"
description = "Modern Web Security Posture & Sensitive Exposure Audit Tool for DevSecOps and Security Researchers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "RobsHs", email = "fredapacitan@gmail.com" }
]
keywords = [
    "cybersecurity",
    "security-scanner",
    "devsecops",
    "vulnerability-scanner",
    "security-headers",
    "exposure-detection",
    "owasp",
    "audit",
    "infosec",
    "bugbounty"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.25.0",
    "rich>=13.0.0",
    "dnspython>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "flake8>=6.0.0",
]

[project.scripts]
aegisscan = "aegisscan.cli:main"

[project.urls]
Homepage = "https://github.com/RobsHs/AegisScan"
Documentation = "https://github.com/RobsHs/AegisScan#readme"
Repository = "https://github.com/RobsHs/AegisScan.git"
"Issue Tracker" = "https://github.com/RobsHs/AegisScan/issues"
